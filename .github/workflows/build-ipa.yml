name: Build iPhone IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Test core and build unsigned IPA
        run: bash Scripts/build-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: HAMODYBR-TikTok-Lab-unsigned-IPA
          path: build/HAMODYBR-TikTok-Lab-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
